<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #0d1117; color: #fff; }
        .container { max-width: 400px; margin: 50px auto; padding: 20px; }
        .auth-box, .chat-box { background: #161b22; padding: 30px; border-radius: 10px; border: 1px solid #30363d; }
        .chat-box { display: none; height: 80vh; flex-direction: column; }
        h2 { text-align: center; margin-bottom: 20px; color: #58a6ff; }
        input { width: 100%; padding: 12px; margin: 8px 0; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #fff; font-size: 14px; }
        input:focus { outline: none; border-color: #58a6ff; }
        button { width: 100%; padding: 12px; margin: 8px 0; background: #238636; border: none; border-radius: 6px; color: #fff; font-size: 14px; cursor: pointer; font-weight: 600; }
        button:hover { background: #2ea043; }
        .logout-btn { background: #da3633; }
        .logout-btn:hover { background: #f85149; }
        .link-btn { background: transparent; color: #58a6ff; padding: 8px; font-weight: normal; }
        .link-btn:hover { background: #21262d; text-decoration: underline; }
        #error-msg { color: #f85149; text-align: center; margin: 10px 0; font-size: 14px; min-height: 20px; }
        #success-msg { color: #3fb950; text-align: center; margin: 10px 0; font-size: 14px; min-height: 20px; }
        #messages { flex: 1; overflow-y: auto; border: 1px solid #30363d; padding: 10px; margin: 10px 0; border-radius: 6px; background: #0d1117; }
        .msg { margin: 8px 0; padding: 8px; background: #21262d; border-radius: 6px; }
        .msg-user { color: #58a6ff; font-size: 12px; }
        .msg-text { margin-top: 4px; }
        .input-row { display: flex; gap: 8px; }
        .input-row input { margin: 0; }
        .input-row button { width: auto; padding: 12px 20px; margin: 0; }
        #user-email { text-align: center; margin-bottom: 10px; color: #8b949e; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Auth Section -->
        <div class="auth-box" id="authBox">
            <h2>Firebase Chat</h2>
            <input type="email" id="email" placeholder="Email" autocomplete="email">
            <input type="password" id="password" placeholder="Password (min 6 characters)" autocomplete="current-password">
            <div id="error-msg"></div>
            <div id="success-msg"></div>
            <button onclick="signUp()">Sign Up</button>
            <button onclick="login()">Login</button>
            <button class="link-btn" onclick="resetPassword()">Forgot Password?</button>
        </div>

        <!-- Chat Section -->
        <div class="chat-box" id="chatBox">
            <h2>Chat Room</h2>
            <div id="user-email"></div>
            <div id="messages"></div>
            <div class="input-row">
                <input type="text" id="messageInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMessage()">
                <button onclick="sendMessage()">Send</button>
            </div>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

    <script>
        // TODO: Replace with your Firebase config
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // DOM Elements
        const authBox = document.getElementById('authBox');
        const chatBox = document.getElementById('chatBox');
        const errorMsg = document.getElementById('error-msg');
        const successMsg = document.getElementById('success-msg');
        const userEmail = document.getElementById('user-email');
        const messages = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');

        // Clear Messages
        function clearMessages() {
            errorMsg.textContent = '';
            successMsg.textContent = '';
        }

        // Show Error
        function showError(message) {
            clearMessages();
            errorMsg.textContent = message;
        }

        // Show Success
        function showSuccess(message) {
            clearMessages();
            successMsg.textContent = message;
        }

        // Sign Up
        function signUp() {
            clearMessages();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (!email || !password) {
                showError('Please enter email and password');
                return;
            }
            if (password.length < 6) {
                showError('Password must be at least 6 characters');
                return;
            }

            auth.createUserWithEmailAndPassword(email, password)
                .then(() => {
                    showSuccess('Account created successfully!');
                })
                .catch((error) => {
                    showError(error.message);
                });
        }

        // Login
        function login() {
            clearMessages();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (!email || !password) {
                showError('Please enter email and password');
                return;
            }

            auth.signInWithEmailAndPassword(email, password)
                .then(() => {
                    showSuccess('Login successful!');
                })
                .catch((error) => {
                    showError(error.message);
                });
        }

        // Reset Password
        function resetPassword() {
            clearMessages();
            const email = document.getElementById('email').value;

            if (!email) {
                showError('Please enter your email first');
                return;
            }

            auth.sendPasswordResetEmail(email)
                .then(() => {
                    showSuccess('Password reset email sent! Check your inbox.');
                })
                .catch((error) => {
                    showError(error.message);
                });
        }

        // Logout
        function logout() {
            auth.signOut();
        }

        // Send Message
        function sendMessage() {
            const text = messageInput.value.trim();
            const user = auth.currentUser;
            
            if (!text || !user) return;

            db.collection('messages').add({
                text: text,
                email: user.email,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
            
            messageInput.value = '';
        }

        // Auth State Listener
        auth.onAuthStateChanged((user) => {
            if (user) {
                authBox.style.display = 'none';
                chatBox.style.display = 'flex';
                userEmail.textContent = 'Logged in as: ' + user.email;
                loadMessages();
            } else {
                authBox.style.display = 'block';
                chatBox.style.display = 'none';
                messages.innerHTML = '';
            }
        });

        // Load Messages
        function loadMessages() {
            db.collection('messages')
                .orderBy('timestamp', 'asc')
                .limit(50)
                .onSnapshot((snapshot) => {
                    messages.innerHTML = '';
                    snapshot.forEach((doc) => {
                        const data = doc.data();
                        const msgDiv = document.createElement('div');
                        msgDiv.className = 'msg';
                        msgDiv.innerHTML = `
                            <div class="msg-user">${data.email}</div>
                            <div class="msg-text">${data.text}</div>
                        `;
                        messages.appendChild(msgDiv);
                    });
                    messages.scrollTop = messages.scrollHeight;
                });
        }
    </script>
</body>
</html>
