<!DOCTYPE html>
<html>
<head>
  <title>BondhuChat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {margin:0; padding:0; box-sizing:border-box; font-family:sans-serif}
    body {background:#111; color:#fff; height:100vh; display:flex}
    #users {width:35%; background:#1f1f1f; border-right:1px solid #333; overflow-y:auto}
    #chat {width:65%; display:flex; flex-direction:column}
    .user {padding:15px; border-bottom:1px solid #333; cursor:pointer}
    .user:hover {background:#2a2a2a}
    .active {background:#075E54 !important}
    #messages {flex:1; padding:10px; overflow-y:auto; background:#0d1418}
    .msg {margin:8px 0; padding:8px 12px; border-radius:8px; max-width:75%; word-wrap:break-word}
    .me {background:#005C4B; margin-left:auto}
    .other {background:#202C33}
    #input-area {display:flex; padding:10px; background:#1f1f1f}
    #msg-input {flex:1; padding:10px; border:none; border-radius:20px; background:#2a2a2a; color:#fff}
    #send-btn {margin-left:10px; padding:10px 15px; border:none; border-radius:20px; background:#00A884; color:#fff}
    #login {position:fixed; inset:0; background:#111; display:flex; align-items:center; justify-content:center; z-index:99}
    .login-box {background:#1f1f1f; padding:30px; border-radius:10px; width:90%; max-width:300px}
    .login-box h2 {text-align:center; margin-bottom:20px; color:#00A884}
    .login-box input {width:100%; padding:12px; margin:8px 0; border:none; border-radius:5px; background:#2a2a2a; color:#fff}
    .login-box button {width:100%; padding:12px; margin-top:10px; border:none; border-radius:5px; background:#00A884; color:#fff; font-weight:bold; cursor:pointer}
    .btn-secondary {background:#2a2a2a !important}
    #header {padding:15px; background:#202C33; border-bottom:1px solid #333; font-weight:bold}
    #logout {float:right; background:#ff3b30; border:none; color:#fff; padding:5px 10px; border-radius:5px; cursor:pointer}
  </style>
</head>
<body>
  <div id="login">
    <div class="login-box">
      <h2>BondhuChat</h2>
      <input type="email" id="email" placeholder="Email">
      <input type="password" id="password" placeholder="Password">
      <button onclick="signIn()">Login</button>
      <button onclick="signUp()">Sign Up</button>
      <button class="btn-secondary" onclick="resetPassword()">Forgot Password?</button>
    </div>
  </div>

  <div id="users"></div>
  <div id="chat">
    <div id="header">
      <span id="chat-with">Select a friend to chat</span>
      <button id="logout" onclick="logout()">Logout</button>
    </div>
    <div id="messages"></div>
    <div id="input-area">
      <input type="text" id="msg-input" placeholder="Type a message" disabled>
      <button id="send-btn" onclick="sendMsg()" disabled>Send</button>
    </div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, sendPasswordResetEmail, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, doc, setDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  // 🔥 তোমার আসল Firebase Config এখানে বসাও 🔥
  const firebaseConfig = {
    apiKey: "AIzaSy...",
    authDomain: "bondhuchat-11204.firebaseapp.com",
    projectId: "bondhuchat-11204",
    storageBucket: "bondhuchat-11204.appspot.com",
    messagingSenderId: "123456789",
    appId: "1:123456789:web:abc123"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  
  // এই লাইনটা বারবার Login লাগার বাগ ফিক্স করবে
  setPersistence(auth, browserLocalPersistence);
  
  let currentUser = null;
  let selectedUser = null;
  let chatId = null;
  let unsubscribe = null;

  window.signUp = async () => {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    if (!email || !password) return alert('Email Password দাও');
    try {
      const userCred = await createUserWithEmailAndPassword(auth, email, password);
      await setDoc(doc(db, "users", userCred.user.uid), {
        email: email,
        uid: userCred.user.uid
      });
    } catch(e) { alert(e.message) }
  }

  window.signIn = async () => {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    if (!email || !password) return alert('Email Password দাও');
    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch(e) { alert(e.message) }
  }

  window.resetPassword = async () => {
    const email = document.getElementById('email').value;
    if (!email) return alert('Email লিখো আগে');
    try {
      await sendPasswordResetEmail(auth, email);
      alert('Password Reset লিংক তোমার Email এ গেছে। Spam ফোল্ডারও চেক করো');
    } catch(e) { alert(e.message) }
  }

  window.logout = () => signOut(auth);

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
      document.getElementById('login').style.display = 'none';
      loadUsers();
    } else {
      document.getElementById('login').style.display = 'flex';
      document.getElementById('email').value = '';
      document.getElementById('password').value = '';
      if (unsubscribe) unsubscribe();
    }
  });

  async function loadUsers() {
    const usersDiv = document.getElementById('users');
    const querySnapshot = await getDocs(collection(db, "users"));
    usersDiv.innerHTML = '<div style="padding:15px; font-weight:bold; border-bottom:1px solid #333">Friends</div>';
    querySnapshot.forEach((doc) => {
      const user = doc.data();
      if (user.uid !== currentUser.uid) {
        const div = document.createElement('div');
        div.className = 'user';
        div.textContent = user.email;
        div.onclick = (e) => selectUser(user, e.target);
        usersDiv.appendChild(div);
      }
    });
  }

  function selectUser(user, element) {
    selectedUser = user;
    document.querySelectorAll('.user').forEach(u => u.classList.remove('active'));
    element.classList.add('active');
    document.getElementById('chat-with').textContent = user.email;
    document.getElementById('msg-input').disabled = false;
    document.getElementById('send-btn').disabled = false;
    
    chatId = currentUser.uid < user.uid ? 
      currentUser.uid + '_' + user.uid : 
      user.uid + '_' + currentUser.uid;
    
    loadMessages();
  }

  function loadMessages() {
    if (unsubscribe) unsubscribe();
    const messagesDiv = document.getElementById('messages');
    messagesDiv.innerHTML = '';
    
    const q = query(collection(db, "chats", chatId, "messages"), orderBy("time"));
    unsubscribe = onSnapshot(q, (snapshot) => {
      messagesDiv.innerHTML = '';
      snapshot.forEach((doc) => {
        const msg = doc.data();
        const div = document.createElement('div');
        div.className = 'msg ' + (msg.uid === currentUser.uid ? 'me' : 'other');
        div.textContent = msg.text;
        messagesDiv.appendChild(div);
      });
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    });
  }

  window.sendMsg = async () => {
    const input = document.getElementById('msg-input');
    const text = input.value.trim();
    if (!text || !chatId) return;
    
    await addDoc(collection(db, "chats", chatId, "messages"), {
      text: text,
      uid: currentUser.uid,
      email: currentUser.email,
      time: serverTimestamp()
    });
    input.value = '';
  }

  document.getElementById('msg-input').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') sendMsg();
  });
</script>
</body>
</html>
